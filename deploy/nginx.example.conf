# Reference only, not installed. Replace hostname/cert paths in authorized environment.
# Place limit zones inside the parent http {} context.
limit_req_zone $binary_remote_addr zone=watchlist_requests:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=watchlist_login:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=watchlist_connections:1m;
server {
    listen 443 ssl;
    server_name monitor.example.invalid;
    ssl_certificate /etc/watchlist/tls/fullchain.pem;
    ssl_certificate_key /etc/watchlist/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_header_timeout 10s;
    client_body_timeout 10s;
    client_max_body_size 32k;
    large_client_header_buffers 2 8k;
    keepalive_timeout 15s;
    send_timeout 15s;
    limit_conn watchlist_connections 8;
    limit_req_status 429;
    access_log off; # avoid URL/header leakage; add a reviewed redacted log separately
    location = /api/v1/auth/login {
        limit_req zone=watchlist_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_read_timeout 30s;
    }
    location / {
        limit_req zone=watchlist_requests burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 75s;
    }
}
